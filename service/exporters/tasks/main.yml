---
- name: Ensure required packages
  apt:
    name: [wget, tar]
    state: present
    update_cache: yes

- name: Download node_exporter
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz

- name: Extract node_exporter
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts: [--strip-components=1]

- name: Create systemd service for node_exporter
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
      Restart=always
      User=nobody

      [Install]
      WantedBy=multi-user.target

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    state: started
    enabled: yes

- name: Download cAdvisor
  get_url:
    url: "https://github.com/google/cadvisor/releases/download/v0.49.1/cadvisor"
    dest: /usr/local/bin/cadvisor
    mode: '0755'

- name: Create systemd service for cAdvisor
  copy:
    dest: /etc/systemd/system/cadvisor.service
    content: |
      [Unit]
      Description=cAdvisor
      After=docker.service

      [Service]
      ExecStart=/usr/local/bin/cadvisor --port=9010
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Enable and start cAdvisor
  systemd:
    name: cadvisor
    state: started
    enabled: yes
